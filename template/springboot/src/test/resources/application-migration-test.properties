# Flyway migration validation runs against the MySQL service configured by CI.
spring.main.web-application-type=none
spring.datasource.url=jdbc:mysql://localhost:3306/tinypro_migration_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=test
spring.datasource.password=test
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
tinypro.llm.api-key=test-api-key
tinypro.llm.extra-body={}
