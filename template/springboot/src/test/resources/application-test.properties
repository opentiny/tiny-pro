# Test-only overrides. Common defaults remain in src/main/resources/application.properties.
tinypro.api-prefix=/api
tinypro.llm.api-key=test-api-key
tinypro.llm.extra-body={}
jwt.secret=test-jwt-secret
tinypro.jwt.secret=test-jwt-secret

# Controller/service context tests use an isolated H2 database.
spring.datasource.url=jdbc:h2:mem:tinypro_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER,KEY,ORDER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=false
spring.flyway.enabled=false
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD:}
auth.refresh-retry-grace-millis=1000
