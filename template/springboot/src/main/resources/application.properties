server.port=3001
spring.datasource.url=jdbc:mysql://localhost:3306/tiny_pro?allowMultiQueries=true&serverTimezone=GMT%2B8&useUnicode=true&characterEncoding=utf8&autoReconnect=true&allowMultiQueries=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=${DATABASE_PASSWORD:111111}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.pool-name=HikariCPDatasource
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=180000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.max-lifetime=180000
spring.datasource.hikari.connection-timeout=30000
mybatis-plus.mapper-locations=classpath:mappers/*.xml
mybatis-plus.type-aliases-package=com.TinyPro.entity.po
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.default-enum-type-handler=org.apache.ibatis.type.EnumOrdinalTypeHandler
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.dialect.storage_engine=innodb
spring.jpa.properties.hibernate.globally_quoted_identifiers=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
jwt.secret=${JWT_SECRET:0Zi4SA==}
# Redis \u914D\u7F6E
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD:000000}
reject.start=${REJECT_START:false}

# Bind application-owned settings as one validated configuration object.
tinypro.jwt.secret=${jwt.secret}
tinypro.reject.start=${reject.start}
tinypro.logging.file=${LOG_FILE:logs/tiny-pro.log}
tinypro.logging.max-file-size=${LOG_MAX_FILE_SIZE:50MB}
tinypro.logging.max-history=${LOG_MAX_HISTORY:30}
tinypro.logging.total-size-cap=${LOG_TOTAL_SIZE_CAP:2GB}
