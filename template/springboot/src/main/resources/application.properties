server.port=3000
# Local development uses application-local.properties by default. Production
# must explicitly set SPRING_PROFILES_ACTIVE=prod.
spring.profiles.default=local
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.pool-name=HikariCPDatasource
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=180000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.max-lifetime=180000
spring.datasource.hikari.connection-timeout=30000
mybatis-plus.mapper-locations=classpath:mappers/*.xml
mybatis-plus.type-aliases-package=com.TinyPro.entity.po
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.default-enum-type-handler=org.apache.ibatis.type.EnumOrdinalTypeHandler
# Hibernate must never mutate the schema. Flyway owns schema changes.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.dialect.storage_engine=innodb
spring.jpa.properties.hibernate.globally_quoted_identifiers=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# Flyway migrations are stored in src/main/resources/db/migration.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
tinypro.api-prefix=${GLOBAL_PREFIX:/api}

# Token TTLs use the same environment variable names and units as NestJS.
auth.access-token-ttl-seconds=${REDIS_SECONDS:7200}
auth.refresh-token-ttl-millis=${REFRESH_TOKEN_TTL:604800000}
auth.api-token-ttl-seconds=${API_TOKEN_SECONDS:604800}
auth.device-limit=${DEVICE_LIMIT:-1}

# Swagger/OpenAPI is disabled by default, matching the NestJS template.
springdoc.api-docs.enabled=${ENABLE_SWAGGER:false}
springdoc.swagger-ui.enabled=${ENABLE_SWAGGER:false}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Actuator health and Kubernetes-style liveness/readiness probes.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Bind application-owned logging settings as one validated configuration object.
tinypro.logging.file=${LOG_FILE:logs/tiny-pro.log}
tinypro.logging.max-file-size=${LOG_MAX_FILE_SIZE:50MB}
tinypro.logging.max-history=${LOG_MAX_HISTORY:30}
tinypro.logging.total-size-cap=${LOG_TOTAL_SIZE_CAP:2GB}
