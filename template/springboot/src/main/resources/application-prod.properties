# Production profile. Activate explicitly with: --spring.profiles.active=prod
# All credentials and the JWT signing key must be supplied by the deployment environment.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}

jwt.secret=${JWT_SECRET}
reject.start=${REJECT_START:false}
tinypro.jwt.secret=${jwt.secret}
tinypro.reject.start=${reject.start}

spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
springdoc.api-docs.enabled=${ENABLE_SWAGGER:false}
springdoc.swagger-ui.enabled=${ENABLE_SWAGGER:false}
