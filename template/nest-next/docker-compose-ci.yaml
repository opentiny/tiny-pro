services:
  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: demo_tiny_pro
    ports:
      - "3306:3306"
    command:
      - --mysql-native-password=ON
  redis:
    image: redis
    ports:
      - "6379:6379"
  db_deploy:
    build:
      context: .
      dockerfile: dockerfile
      target: migrator
    environment:
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: root
      DATABASE_NAME: demo_tiny_pro
    depends_on:
      - mysql
  seeder:
    build:
      context: .
      dockerfile: dockerfile
      target: seeder
    environment:
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: root
      DATABASE_NAME: demo_tiny_pro
    depends_on:
      - mysql
      - db_deploy
  srv:
    build:
      context: .
      dockerfile: dockerfile
      target: final

    depends_on:
      - mysql
      - redis
    volumes:
      - ./config:/app/dist/config
