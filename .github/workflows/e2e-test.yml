name: Playwright E2E Tests

on:
  pull_request:
    paths:
      - 'template/tinyvue/**'
  workflow_dispatch:

jobs:
  e2e-test:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 10
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v1
      - name: Start Backend Services
        working-directory: ./template/nestJs
        env:
          COMPOSE_BAKE: "false"
        run: |
          cp .env.example .env
          docker compose up -d
      - name: Wait for Backend Services
        working-directory: ./template/nestJs
        run: |
          echo "Waiting for Backend Services to start..."
          timeout 120s bash -c 'until curl -f http://localhost:3000/healthCheck 2>/dev/null; do
            echo "Backend API not ready yet..."
            sleep 3
          done'
          echo "Backend Services are ready!"
      - name: Dump backend logs
        if: failure()
        working-directory: ./template/nestJs
        run: docker compose logs
      - name: Run E2E tests
        env:
          PLAYWRIGHT_WEB_SERVER_COMMAND: pnpm dev:full
        run: pnpm test:e2e
