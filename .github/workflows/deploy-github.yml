name: Deploy to github.io

on:
  push:
    branches: [ dev, main ]   # 设置源码主分支
  workflow_dispatch: {}  # 支持手动触发

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install deps
        run: pnpm install --frozen-lockfile --filter tiny-pro-vue...
      - name: Build site
        run: pnpm -F tiny-pro-vue build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_CONTEXT: /${{ github.event.repository.name }}/
          VITE_BASE_API: /api
          VITE_MOCK_SERVER_HOST: /mock
          VITE_USE_MOCK: true
          VITE_LOWCODE_DESIGNER_ENABLED: false
      - name: Prepare GitHub Pages
        run: |
          touch ./template/tinyvue/dist/.nojekyll
          cp ./template/tinyvue/dist/index.html ./template/tinyvue/dist/404.html
          find ./template/tinyvue/dist -name '*.gz' -delete
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./template/tinyvue/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
